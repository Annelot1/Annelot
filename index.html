  <section class="cookie-widget" aria-label="Cookievoorkeuren">
    <!-- OPENEN EN SLUITEN -->
    <input
      type="radio"
      name="cookie-status"
      id="cookie-open"
      class="cookie-toggle"
    />

    <input
      type="radio"
      name="cookie-status"
      id="cookie-close"
      class="cookie-toggle"
    />

    <!-- COOKIE POP-UP -->
    <div class="cookie-popup">
      <!-- MATCHA ICOON -->
      <label for="cookie-open" class="matcha-cookie">
        <img
          src="assets/images/matcha-cookie.png"
          alt="Matcha-koekje"
          class="matcha-cookie-img"
        />
      </label>

      <!-- INHOUD -->
      <div class="cookie-content">
        <h2>A little cookie?</h2>

        <p>The Green Ritual gebruikt cookies om je ervaring te verbeteren.</p>

        <!-- KNOPPEN -->
        <div class="cookie-buttons">
          <label for="cookie-close">Accepteren</label>
          <label for="cookie-close">Weigeren</label>
        </div>
      </div>
    </div>
  </section>

    <nav class="navbar">

    <section class="foto">
      <figure class="slide slide-1">
        <img src="./assets/images/Matchatuin.jpg" alt="Matcha tuin" />
        <h1>Ontdek de reis van matcha</h1>
        <p>Waar het begint in de Japanse tuinen</p>
      </figure>
      <figure class="slide slide-2">
        <img src="./assets/images/Matchapoeder.png" alt="Matcha poeder" />
        <h2>Van blad tot poeder</h2>
      </figure>
      <figure class="slide slide-3">
        <img src="./assets/images/Matchakom.jpg" alt="Matcha kom" />
        <h2>Tot een heerlijk drankje</h2>
      </figure>
