<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Green Ritual</title>

  <link rel="stylesheet" href="style/normal.css" />

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>

<body>
  <section id="hero">
    <div id="progress"></div>

    <div class="controls">
      <button class="button-up" onclick="hero.scrollBy(0, -window.innerHeight)">
        <i class="ri-arrow-up-circle-line"></i>
      </button>

      <button
        class="button-down"
        onclick="hero.scrollBy(0, window.innerHeight)"
      >
        <i class="ri-arrow-down-circle-line"></i>
      </button>
    </div>

    <!-- FOTO 1 -->
    <figure>
      <img src="assets/images/Matchapoeder.jpg" alt="Matcha poeder" />
    </figure>

    <!-- FOTO 2 -->
    <figure>
      <img src="assets/images/Matchatuin.jpg" alt="Matcha tuin" />
    </figure>
  </section>
</body>
